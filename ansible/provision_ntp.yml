---
- name: Provision NTP Server
  hosts: cisco_devices
  gather_facts: no

  tasks:
    - name: Configure NTP server
      cisco.ios.ios_config:
        lines:
          - ntp server 10.255.12.5
          - ntp server 10.255.12.6

    - name: Save configuration
      cisco.ios.ios_config:
        save_when: modified
